name: Sync Folium market
run-name: Sync market for ${{ inputs.tag }}

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag (e.g. v1.2.3)
        required: true
        type: string

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download the published installation ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a release tag such as v1.2.3"
            exit 1
          fi
          published=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft --jq 'select(.isDraft == false).tagName')
          test "$published" = "$RELEASE_TAG"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "music-notes-${RELEASE_TAG#v}.zip" --dir "$RUNNER_TEMP"
      - name: Prepare music-notes for the market
        run: |
          if ! /usr/bin/python3 -c 'from PIL import Image' 2>/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends python3-pil
          fi
          /usr/bin/python3 .github/scripts/prepare-market.py "$RELEASE_TAG" \
            "$RUNNER_TEMP/music-notes-${RELEASE_TAG#v}.zip" "$RUNNER_TEMP/market/music-notes"
      - name: Update market and report the submission commit
        run: bash .github/scripts/publish-market.sh "$RELEASE_TAG" "$RUNNER_TEMP/market/music-notes"
